<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Analytics Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 30px;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
  }
  .card h2 {
    font-size: 15px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 8px 0;
  }
  .card .value {
    font-size: 32px;
    font-weight: 700;
    color: #38bdf8;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    text-align: left;
    padding: 10px;
    border-bottom: 1px solid #334155;
    font-size: 14px;
  }
  th {
    color: #94a3b8;
    font-weight: 600;
  }
  .chart-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
    margin-bottom: 30px;
  }
  .section-title {
    font-size: 18px;
    margin-bottom: 15px;
  }
</style>
</head>
<body>

<h1>Order Analytics Dashboard</h1>
<div class="subtitle">Live data from FastAPI backend</div>

<div class="grid">
  <div class="card">
    <h2>Total Products</h2>
    <div class="value" id="totalProducts">–</div>
  </div>
  <div class="card">
    <h2>Total Orders</h2>
    <div class="value" id="totalOrders">–</div>
  </div>
  <div class="card">
    <h2>Total Customers</h2>
    <div class="value" id="totalCustomers">–</div>
  </div>
</div>

<div class="chart-container">
  <div class="section-title">Daily Sales</div>
  <canvas id="salesChart" height="90"></canvas>
</div>

<div class="chart-container">
  <div class="section-title">Products</div>
  <input type="text" id="searchBox" placeholder="Search products..."
    style="width:100%; padding:10px; margin-bottom:15px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#e2e8f0; font-size:14px;">
  <table id="productsTable">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";
let allProducts = [];

function renderProducts(list) {
  const tbody = document.querySelector("#productsTable tbody");
  tbody.innerHTML = list.map(p => {
    const lowStock = p.stock_qty < 10;
    return `<tr>
      <td>${p.id}</td>
      <td>${p.name}</td>
      <td>Rs. ${p.price}</td>
      <td style="${lowStock ? 'color:#f87171; font-weight:600;' : ''}">
        ${p.stock_qty} ${lowStock ? '⚠️ Low Stock' : ''}
      </td>
    </tr>`;
  }).join("");
}

async function loadDashboard() {
  // Products
  const productsRes = await fetch(`${API_BASE}/products/`);
  allProducts = await productsRes.json();
  document.getElementById("totalProducts").innerText = allProducts.length;

  renderProducts(allProducts);

  document.getElementById("searchBox").addEventListener("input", (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = allProducts.filter(p => p.name.toLowerCase().includes(term));
    renderProducts(filtered);
  });

  // Orders
  const ordersRes = await fetch(`${API_BASE}/orders/`);
  const orders = await ordersRes.json();
  document.getElementById("totalOrders").innerText = orders.length;

  // Customers
  const customersRes = await fetch(`${API_BASE}/customers/`);
  const customers = await customersRes.json();
  document.getElementById("totalCustomers").innerText = customers.length;

  // Daily sales chart
  const salesRes = await fetch(`${API_BASE}/analytics/daily-sales`);
  const sales = await salesRes.json();
  const labels = sales.map(s => s.date.split("T")[0]);
  const values = sales.map(s => s.total_sales);

  new Chart(document.getElementById("salesChart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Total Sales",
        data: values,
        borderColor: "#38bdf8",
        backgroundColor: "rgba(56, 189, 248, 0.1)",
        fill: true,
        tension: 0.3,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#94a3b8", maxTicksLimit: 10 }, grid: { color: "#334155" } },
        y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } }
      }
    }
  });
}

loadDashboard();
</script>

</body>
</html>
